name: Skills CI

# Tests the tooling this template ships — the scripts its skills call, and the
# layout those skills have to follow to load at all. This is not the scaffolded
# project's CI: init-project writes that separately as ci.yml. Both can coexist,
# and a project that keeps .claude/skills/ should keep this one too.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: Shell lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # shellcheck ships on the ubuntu-latest image, so no install step.
      - name: Lint shell scripts
        run: |
          mapfile -t scripts < <(find . -path ./.git -prune -o -type f -name '*.sh' -print)
          printf 'Linting %d script(s):\n' "${#scripts[@]}"
          printf '  %s\n' "${scripts[@]}"
          shellcheck "${scripts[@]}"

      - name: Validate skill layout
        run: bash scripts/validate_skills.sh

      - name: Test check_inherited_docs.sh
        run: bash .claude/skills/init-project/scripts/test_check_inherited_docs.sh

      - name: Test compare_template.sh
        run: bash .claude/skills/sync-from-template/scripts/test_compare_template.sh

  python:
    name: Python lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest ruff

      - name: Lint Python scripts
        run: ruff check .claude/skills

      - name: Test categorize_prs.py
        run: python -m pytest .claude/skills/dependabot/scripts -q
