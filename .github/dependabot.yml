version: 2

updates:
  # GitHub Actions — keeps the actions pinned in .github/workflows/ current.
  # skills-ci.yml is the template's own workflow; init-project adds the
  # scaffolded project's ci.yml alongside it.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"

  # The template's own lint/test tooling, pinned in requirements-dev.txt. This
  # is not the scaffolded project's stack — it exists so a ruff or pytest bump
  # arrives as a reviewable PR rather than silently changing what CI enforces.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "tooling"

  # The init-project skill (.claude/skills/init-project/) adds one block per
  # stack it scaffolds (e.g. "pip" for a backend/ folder, "npm" for a frontend/
  # folder) — see
  # https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
