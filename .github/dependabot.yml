version: 2

updates:
  # GitHub Actions — keeps the actions pinned in .github/workflows/ current.
  # skills-ci.yml is the template's own workflow; init-project adds the
  # scaffolded project's ci.yml alongside it.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"

  # The init-project skill (.claude/skills/init-project/) adds one block per
  # stack it scaffolds (e.g. "pip" for a backend/ folder, "npm" for a frontend/
  # folder) — see
  # https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
